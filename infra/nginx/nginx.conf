events {
    worker_connections 1024;
}

http {
    # Aponta para o DNS interno do Docker e atualiza a cada 30s
    resolver 127.0.0.11 valid=30s;

    server {
        listen 80;
        # Proxy para API Collector (mantém o mesmo URI: /api/... -> /api/...) 
        location /api/ {
            set $backend_api http://lume_collector:8080;
            proxy_pass $backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_cache_bypass $http_upgrade;
        }

        # Expor Prometheus em /prometheus/ (strip prefix on pass)
        location /prometheus/ {
            # 1. Resolve o erro 502 forçando a resolução dinâmica de DNS via Docker
            resolver 127.0.0.11 valid=10s;
            set $upstream_prometheus http://prometheus:9090;
            
            # 2. Faz o repasse da requisição sem nenhuma barra no final.
            # Como o Prometheus já sabe que está em /prometheus/, o Nginx apenas repassa a URI intacta.
            proxy_pass $upstream_prometheus;
            
            # 3. Headers padrão para preservar a origem
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
    }

        # Grafana está configurado com GF_SERVER_SERVE_FROM_SUB_PATH, então
        # encaminhamos /grafana/ diretamente e mantemos o prefix
        location /grafana/ {
            proxy_pass http://grafana:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_redirect off;
        }

        # Redirecionamentos úteis
        location = /metrics {
            return 307 /api/v1/metrics;
        }

        # Root - redirect to Grafana UI
        location / {
            return 302 /grafana/;
        }
    }
}