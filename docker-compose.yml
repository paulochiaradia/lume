services:

  postgres:
    image: postgres:16-alpine
    container_name: lume_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lume_network

  redis:
    image: redis:7-alpine
    container_name: lume_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lume_network

  collector:
    build:
      context: ./collector
      dockerfile: Dockerfile
    container_name: lume_collector
    restart: unless-stopped
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ENV: ${ENV}
      JWT_SECRET: ${JWT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
    volumes:
      - ./clients:/app/clients
      - ./infra/postgres/migrations:/app/migrations
      - ./testdata:/app/testdata
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lume_network

  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    container_name: lume_engine
    restart: unless-stopped
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      DUCKDB_PATH: /app/data/duckdb
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER}
      ENV: ${ENV}
    volumes:
      - duckdb_data:/app/data/duckdb
      - ./clients:/app/clients
      - reports_data:/app/data/reports
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lume_network
        
  # Streamlit removed — use Grafana or Prometheus via nginx proxy instead

  grafana:
    image: grafana/grafana:latest
    container_name: lume_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_SERVER_ROOT_URL: http://localhost/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - postgres
    networks:
      - lume_network

  nginx:
    image: nginx:alpine
    container_name: lume_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - collector
      - grafana
      - prometheus
      - loki
      - promtail
    networks:
      - lume_network

  # 1. Prometheus (Métricas Numéricas)
  prometheus:
    image: prom/prometheus:latest
    container_name: lume_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # Nenhuma porta exposta aqui! O Nginx fará todo o trabalho.
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.external-url=/prometheus/'
      - '--web.route-prefix=/prometheus/'
    networks:
      - lume_network

  # 2. Loki (Banco de Dados de Logs)
  loki:
    image: grafana/loki:latest
    container_name: lume_loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - lume_network

  # 3. Promtail (O carteiro que lê o slog e entrega pro Loki)
  promtail:
    image: grafana/promtail:latest
    container_name: lume_promtail
    user: root
    restart: unless-stopped
    ports:
      - "9080:9080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - lume_network

volumes:
  postgres_data:
  duckdb_data:
  grafana_data:
  reports_data:
  redis_data:

networks:
  lume_network:
    driver: bridge